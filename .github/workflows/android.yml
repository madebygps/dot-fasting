name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  without-glyph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build, test and lint
        run: ./gradlew :app:assembleWithoutGlyphDebug :app:testWithoutGlyphDebugUnitTest :app:lintWithoutGlyphDebug --console=plain
